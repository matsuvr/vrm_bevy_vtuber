[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Repository automation tasks for vrm-bevy-vtuber."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
bevy = "=0.19.0"
bevy_vrm1 = { git = "https://github.com/not-elm/bevy_vrm1", rev = "f9593fd78136fb9e0507bcae111e09291ec9b82a", features = ["log"] }
vtuber-core = { path = "../../crates/vtuber-core" }
vtuber-camera = { path = "../../crates/vtuber-camera" }
vtuber-app = { path = "../../crates/vtuber-app" }
vtuber-avatar = { path = "../../crates/vtuber-avatar" }
vtuber-inference = { path = "../../crates/vtuber-inference" }
vtuber-tracking = { path = "../../crates/vtuber-tracking" }
# JPEG input is needed only by the still-image detector diagnostic.
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

[dev-dependencies]

[lints]
workspace = true
