[legacy_research_pipeline.detector_postprocess]
score_threshold = 0.7
nms_iou = 0.3
max_pre_nms_candidates = 256
max_post_nms_detections = 16

[legacy_research_pipeline.crop]
square_scale = 1.35
center_y_offset_fraction = -0.05
output_size = [256, 256]
interpolation = "bilinear"
outside_fill = "normalization_mean"

