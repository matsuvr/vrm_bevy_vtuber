[workspace]
members = [
  "crates/vtuber-core",
  "crates/vtuber-camera",
  "crates/vtuber-inference",
  "crates/vtuber-tracking",
  "crates/vtuber-avatar",
  "crates/vtuber-app",
  "apps/desktop",
  "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
authors = ["vrm-bevy-vtuber contributors"]
repository = "https://github.com/vrm-bevy-vtuber/vrm-bevy-vtuber"

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_panics_doc = "allow"
