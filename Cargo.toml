[workspace]
members = [
  "crates/vtuber-core",
  "crates/vtuber-camera",
  "crates/vtuber-inference",
  "crates/vtuber-gnm",
  "crates/vtuber-tracking",
  "crates/vtuber-avatar",
  "crates/vtuber-ndi",
  "crates/vtuber-app",
  "apps/desktop",
  "tools/xtask",
]
exclude = ["vendor/bevy_vrm1"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
authors = ["vrm-bevy-vtuber contributors"]
repository = "https://github.com/vrm-bevy-vtuber/vrm-bevy-vtuber"

[workspace.dependencies]
bevy_egui = { version = "=0.41.1", default-features = false, features = ["default_fonts", "render"] }
rfd = { version = "=0.17.2", default-features = false }

[patch."https://github.com/not-elm/bevy_vrm1"]
bevy_vrm1 = { path = "vendor/bevy_vrm1" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
missing_panics_doc = "allow"
