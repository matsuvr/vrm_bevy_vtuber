[package]
name = "vtuber-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Face model loading, preprocessing, and pure-Rust inference for vrm-bevy-vtuber."

[dependencies]
vtuber-core = { path = "../vtuber-core" }
tract-tflite = "=0.23.4"
tract-onnx = { version = "=0.23.4", optional = true }
tract-core = { version = "=0.23.4", optional = true }
sha2 = "=0.10.8"
hex = "=0.4.3"
thiserror = "2"
anyhow = "=1.0.103"

[features]
# The accepted production path is the pure-Rust tract ONNX backend. TFLite
# support remains compiled for provenance/evaluation fixtures, but is not
# selected by the production model catalog.
default = ["onnx"]
onnx = ["dep:tract-onnx", "dep:tract-core"]

[dev-dependencies]

[lints]
workspace = true
